# Build the GlassyVision image with NEXT_PUBLIC_* baked in (public values only —
# the anon key is public by design; server secrets are mounted at runtime by
# Cloud Run from Secret Manager, never baked into the image).
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY}'
      - '--build-arg'
      - 'NEXT_PUBLIC_SITE_URL=${_NEXT_PUBLIC_BASE_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_BASE_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_BASE_URL=${_NEXT_PUBLIC_BASE_URL}'
      - '--build-arg'
      - 'SHOPIFY_STORE_DOMAIN=${_SHOPIFY_STORE_DOMAIN}'
      - '--build-arg'
      - 'SHOPIFY_STOREFRONT_ACCESS_TOKEN=${_SHOPIFY_STOREFRONT_ACCESS_TOKEN}'
      - '-t'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/glassyvision/app:$BUILD_ID'
      - '-t'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/glassyvision/app:latest'
      - '.'
images:
  - 'us-east1-docker.pkg.dev/$PROJECT_ID/glassyvision/app:$BUILD_ID'
  - 'us-east1-docker.pkg.dev/$PROJECT_ID/glassyvision/app:latest'
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
